name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar

      - name: Collect JARs
        run: |
          mkdir -p jars
          find . -path "*/build/libs/*.jar" -type f \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-tests.jar" \
            ! -name "*-plain.jar" \
            -exec cp {} jars/ \;

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: jars-${{ github.sha }}
          path: jars/*.jar
          if-no-files-found: error
          retention-days: 14

  # The generated API client is committed so it is reviewable in diffs and so a
  # checkout builds without a generation step. That is only trustworthy if a stale
  # one fails the build -- otherwise committing it is just noise, and the client
  # silently drifts from the spec it claims to describe.
  api-client-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: realty-web/realty-explorer
        run: npm ci

      - name: Regenerate the API client
        working-directory: realty-web/realty-explorer
        run: npm run generate:api

      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- realty-web/realty-explorer/src/api/schema.d.ts; then
            echo "::error::openapi.yaml changed without regenerating the API client."
            echo "Run: cd realty-web/realty-explorer && npm run generate:api"
            exit 1
          fi
