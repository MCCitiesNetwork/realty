name: Deploy Maven

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine the version and repository path
        id: repo-path
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # A release publishes the version its tag names, the way the jar release
          # does, so the artifacts a release produces cannot disagree with it. Run by
          # hand instead and there is no tag, so the literal every ordinary build uses
          # stands -- which is a -SNAPSHOT, and lands in the snapshot repository.
          if [ -n "${TAG}" ]; then
            VERSION="${TAG#v}"
            echo "gradleArgs=-PreleaseVersion=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' buildSrc/src/main/kotlin/realty-conventions.gradle.kts)
            echo "gradleArgs=" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing ${VERSION}"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "suffix=/snapshots" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=/releases" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven
        run: |
          chmod +x ./gradlew
          ./gradlew publishMavenPublicationToDeployRepository ${{ steps.repo-path.outputs.gradleArgs }}
        env:
          ORG_GRADLE_PROJECT_deployUrl: ${{ secrets.MAVEN_REPOSITORY_URL }}${{ steps.repo-path.outputs.suffix }}
          ORG_GRADLE_PROJECT_deployUsername: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          ORG_GRADLE_PROJECT_deployPassword: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
