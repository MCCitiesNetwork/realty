# query-service
#
# A private HTTP endpoint inside the game server that answers for the two things Realty's
# database does not hold: live WorldGuard region geometry, and player names. It exists for
# realty-rest, which runs as a separate process; it is not a second public API.
#
# Every request must carry the shared secret in the X-Realty-Secret header. Leaving it empty
# does NOT run the endpoint open — it disables the endpoint entirely, and realty-rest degrades
# to returning null geometry and null names.
shared-secret: ""

# Interface to bind. Localhost by default, so a same-host realty-rest can reach it and nothing
# else can. Set to 0.0.0.0 only if realty-rest runs on another host or in another container,
# and front it with a reverse proxy if that hop crosses a network you do not control.
bind-host: "127.0.0.1"
port: 8123

# WorldGuard's region data may only be read on the main thread, so a geometry request waits
# for a main-thread tick. If one does not come within this many milliseconds the request fails
# with 504 rather than holding an HTTP worker while the server is stalled.
request-timeout-ms: 1000

# Resource pack the web explorer textures previews with, as a URL the viewer's browser
# can fetch. Empty means none, and previews then render with no textures at all -- not
# merely untextured blocks: most blocks have no geometry of their own and simply do not
# appear, so a plot looks like a failed capture.
#
# This is NOT server.properties' resource-pack. That pack is sent to the game client,
# which loads it over its own copy of the game, so it is usually an override pack; a
# browser has no vanilla assets underneath it. Name a pack that stands on its own.
#
# Realty never hosts or serves the pack -- only this URL is passed on, and the browser
# fetches it directly. Two things to check when a preview stays untextured: the host must
# send CORS headers (pack hosts often do not, having only ever served the game client),
# and the pack must be one you have the right to publish.
resource-pack-url: ""

# Credit for the pack above, shown in the web explorer wherever that pack's textures are
# used -- under a region's 3D preview, and nowhere else, since that is the only place the
# pack does anything.
#
# Most packs are licensed on condition that they are credited, and the pack is named here,
# on the game server, where nobody browsing the site can see it. So the credit is stated
# here too: one file, next to the choice it credits.
#
# Each entry is either a plain string, or text with a link. Links must be absolute http(s)
# URLs -- they are followed by the viewer's browser -- and a missing or empty text fails
# the read rather than publishing a blank credit.
#
#   resource-pack-attribution:
#     - text: "Textures: Faithful 64x"
#       url: "https://faithfulpack.net/"
#     - "CC BY 4.0"
resource-pack-attribution: []
