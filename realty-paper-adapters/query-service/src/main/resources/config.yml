# query-service
#
# A private HTTP endpoint inside the game server that answers for the two things Realty's
# database does not hold: live WorldGuard region geometry, and player names. It exists for
# realty-rest, which runs as a separate process; it is not a second public API.
#
# Every request must carry the shared secret in the X-Realty-Secret header. Leaving it empty
# does NOT run the endpoint open — it disables the endpoint entirely, and realty-rest degrades
# to returning null geometry and null names.
shared-secret: ""

# Interface to bind. Localhost by default, so a same-host realty-rest can reach it and nothing
# else can. Set to 0.0.0.0 only if realty-rest runs on another host or in another container,
# and front it with a reverse proxy if that hop crosses a network you do not control.
bind-host: "127.0.0.1"
port: 8123

# WorldGuard's region data may only be read on the main thread, so a geometry request waits
# for a main-thread tick. If one does not come within this many milliseconds the request fails
# with 504 rather than holding an HTTP worker while the server is stalled.
request-timeout-ms: 1000

# Resource packs the web explorer textures previews with, as URLs the viewer's browser
# can fetch. Empty means none, and previews then render with no textures at all -- not
# merely untextured blocks: most blocks have no geometry of their own and simply do not
# appear, so a plot looks like a failed capture.
#
# FIRST IS HIGHEST PRIORITY. Where two packs provide the same texture the earlier one
# wins, so write an override pack above the base pack it expects underneath it. That
# layering is the reason this is a list: the pack you send to the game client with
# server.properties' resource-pack is applied over the client's own copy of the game, so
# on its own in a browser it draws almost nothing. Listing a pack that carries the base
# assets below it is what supplies what the client would otherwise have had.
#
# Each entry is either a bare URL string, or a map of `url` and an `attribution` list in
# the same shape as a credit below. Credits belong to the entry rather than to the file:
# two packs may be licensed differently, and a credit on the wrong pack credits the wrong
# author. They are shown in the web explorer wherever that pack's textures are used --
# under a region's 3D preview, and nowhere else, since that is the only place a pack does
# anything. Links must be absolute http(s) URLs, and a blank credit fails the read rather
# than publishing an empty line.
#
# Realty never hosts or serves a pack -- only these URLs are passed on, and the browser
# fetches each directly. Two things to check when a preview stays untextured: every host
# must send CORS headers (pack hosts often do not, having only ever served the game
# client), and each pack must be one you have the right to publish.
#
#   resource-packs:
#     - url: "https://packs.example.com/server-override.zip"
#       attribution:
#         - text: "Textures: Example Pack 32x"
#           url: "https://packs.example.com/"
#     - url: "https://packs.example.com/vanilla-base.zip"
#       attribution:
#         - "CC BY 4.0"
resource-packs: []
