# The default landlord and authority. Every default must resolve at startup; one that does not is
# logged as an error, and the commands that need it refuse to run.
# type: government | business | system | group. Leave type out for a player.
# For a player, `uuid: <uuid>` may be given instead of `name`.
# A business or system account is named as #<id>.
default-freehold-authority: { name: GovSecurity, type: government }
default-leasehold-landlord: { name: GovSecurity, type: government }
# default-freehold-titleholder: { name: Steve }   # players only; leave out for no titleholder
date-format: "EEE, d MMMM yyyy (HH:mm)"
# Maximum number of region profiles to re-apply per tick during startup/reload.
# Lower values reduce lag spikes, higher values complete faster.
profile-reapply-per-tick: 10
# Minimum volume (in blocks) for subregion selections.
subregion-min-volume: 20
# Duration (in seconds) for an accepted offer payment deadline. Default: 86400 (24 hours).
offer-payment-duration-seconds: 86400
# Minimum notice (in seconds) before a rental termination takes effect. The notice is always honoured:
# if the current paid term ends sooner, the lease is extended to cover it (a tenant pays for those
# extensions) and any prepaid-but-unused time is refunded when the lease finally ends.
# Default: 604800 (7 days).
lease-termination-notice-seconds: 604800
# Tag IDs that prevent a parent region from being subregioned.
# If a region has any of these tags, it cannot be used as a parent for subregion creation.
subregion-tag-blacklist: []
# Material of the subregion selection wand handed out by /realty subregion wand.
# Use a material distinct from WorldEdit's wand (default wooden axe) to avoid confusion.
subregion-wand-material: "GOLDEN_AXE"
# Y-level at which the safe location finder will start looking in the case of very tall plots.
# It's advisable to set this just above the average ground level of your map.
teleportation-starting-height: 80
# How long a region must wait between /realty schematic capture runs.
# 3600 = one hour. 0 disables the cooldown.
# Bypassed by --force (realty.command.schematic.capture.force).
schematic-capture-cooldown-seconds: 3600
# Largest region, in blocks (width x height x length), that may be captured.
# 0 disables the check. This is a hard limit: --force does NOT lift it, because an
# oversized schematic is rejected by MariaDB's max_allowed_packet on write. Raise
# this setting if you genuinely need larger captures.
schematic-max-volume: 1000000
# Blocks copied per tick while capturing. Higher finishes sooner and costs more per
# tick; lower is gentler and takes longer. The capture never blocks a whole tick.
schematic-capture-blocks-per-tick: 20000
# Who may act for a Treasury account that is a landlord or an authority: "members" (members and
# authorizers of the account) or "authorizers" (authorizers only). Handing the role to another party
# always needs an authorizer.
account-managers: members
