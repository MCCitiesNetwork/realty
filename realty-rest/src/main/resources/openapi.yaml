openapi: 3.0.3
info:
  title: Realty REST API
  description: >-
    Read-only HTTP surface over Realty's region economy data. This service never
    migrates or writes -- every endpoint is backed by query methods only.
  version: "1.0"
servers:
  - url: /
paths:
  /v1/health:
    get:
      summary: Liveness/readiness check
      operationId: getHealth
      description: >-
        Reports whether the database is reachable. Intended for load-balancer and
        orchestrator health probes, not for consumers of the data endpoints below.
      responses:
        "200":
          description: >-
            The service is up and the database is reachable. `module` reports the
            query-service module's own status separately -- an unreachable module
            is a degraded enrichment source, not an unhealthy service, so it never
            turns this response into a 503.
          content:
            application/json:
              schema:
                type: object
                required: [ status, module ]
                properties:
                  status:
                    type: string
                    enum: [ ok ]
                  module:
                    type: string
                    enum: [ ok, unreachable, disabled ]
        "503":
          description: The database could not be reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ degraded ]
  /v1/worlds:
    get:
      summary: List every world known to Realty
      operationId: listWorlds
      description: >-
        Returns every row of the RealtyWorld table. Always 200; an empty array
        means no world has ever been registered.
      responses:
        "200":
          description: The full list of known worlds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldRef"
  /v1/region:
    get:
      summary: Look up a single region
      operationId: getRegion
      description: The HTTP form of the in-game `/realty info` command.
      parameters:
        - name: world
          in: query
          required: true
          description: >-
            A world's UUID or its name. A world name is a folder name on disk and
            may contain spaces or other characters requiring percent-encoding
            (for example `My World` becomes `My%20World`, or `+` may be used in
            place of a space) -- send the raw name percent-encoded, do not
            pre-decode it.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id, exactly as WorldGuard stores it.
          schema:
            type: string
      responses:
        "200":
          description: The region's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when `world` or `region` is absent or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `WORLD_NOT_FOUND` when `world` names no known world; `REGION_NOT_FOUND`
            when the region does not exist in that world.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/region/history:
    get:
      summary: One region's history
      operationId: getRegionHistory
      description: >-
        The HTTP form of `/realty history`, which is granted by default and accepts
        any region. Also answers the questions that would otherwise want routes of
        their own: a region's price history is `type=BUY`, and who has rented it
        before is `type=RENT`. A region nobody has traded is a 200 with an empty
        `entries` array, not a 404.
      parameters:
        - name: world
          in: query
          required: true
          description: A world name or UUID.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: >-
            Restrict to one event type. Case-insensitive; an unrecognised value is
            rejected rather than ignored, so a typo does not silently return
            everything.
          schema:
            type: string
            enum: [ BUY, AUCTION_BUY, OFFER_BUY, AGENT_ADD, AGENT_REMOVE, RENT, UNRENT,
                    RENEW, LEASEHOLD_EXPIRY, SET_PRICE, UNSET_PRICE, SET_TITLEHOLDER,
                    UNSET_TITLEHOLDER, SET_DURATION, SET_LANDLORD, SET_TENANT,
                    UNSET_TENANT, SET_MAX_EXTENSIONS, MODIFY_PROPOSE, MODIFY_ACCEPT,
                    MODIFY_REJECT, MODIFY_WITHDRAW, MODIFY_APPLY, TERMINATE,
                    TERMINATION_CANCEL ]
        - name: since
          in: query
          required: false
          description: >-
            Only events at or after this instant. Must carry an offset (`Z` or
            `+hh:mm`): a bare local date-time is rejected rather than assumed to be
            UTC, since assuming would shift a caller's window by hours in silence.
            The command takes a relative duration instead; `now - duration` is a
            trivial conversion on the client.
          schema:
            type: string
            format: date-time
        - name: playerId
          in: query
          required: false
          description: >-
            Only events this player took part in, by UUID. Needs no module. Give at
            most one of `playerId` or `playerName`; giving neither does not filter.
          schema:
            type: string
            format: uuid
        - name: playerName
          in: query
          required: false
          description: >-
            The same filter by name, resolved through the query-service module, so it
            answers 404 for an unknown name and 502 when the module is unreachable.
            Give at most one of `playerId` or `playerName`.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The requested page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: >-
            `MISSING_PARAMETER`, `AMBIGUOUS_PARAMETER` (both `playerId` and
            `playerName` given), `INVALID_EVENT_TYPE`, `INVALID_SINCE`,
            `MALFORMED_UUID`, `INVALID_PAGE` or `INVALID_PAGE_SIZE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- Realty has never seen that world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/regions:
    get:
      summary: List every registered region
      operationId: listRegions
      description: >-
        A page of every region Realty has registered, whether or not it carries a
        contract, in a fixed total order (WorldGuard region id, then world id,
        then internal row id) so that paging cannot repeat or skip a row. Entries
        are identity only -- use `/v1/region` for one region's full state, or
        `/v1/regions/search` to browse what is actually on the market.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `regions` array means no region is
            registered, or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionListResponse"
        "400":
          description: >-
            `INVALID_PAGE` or `INVALID_PAGE_SIZE` for a non-integer or
            out-of-range value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/regions/search:
    get:
      summary: Search regions by type, world, price, tags and occupancy
      operationId: searchRegions
      description: >-
        The bulk browse endpoint, backed by the same query as the in-game
        `/realty search` dialog. Every filter is optional; with none given it
        returns every region carrying a contract, most expensive first. A result
        carries only identity, contract type and price -- fetch `/v1/regions` for
        a single region's full state. No match is a 200 with an empty `results`
        array, never a 404.
      parameters:
        - name: type
          in: query
          required: false
          description: >-
            Which contracts to search. `sale` is freeholds with an asking price,
            `rent` is leaseholds, and `all` (the default) is both -- the market
            view, matching the in-game `/realty search`. `freehold` widens to
            every freehold contract, including sold or never-listed regions,
            which come back with a null `price`; the price bounds apply only to
            the priced rows, since an unpriced one has nothing to compare.
            `leasehold` is every leasehold contract, which is the same set as
            `rent` because a lease always carries a price.
          schema:
            type: string
            enum: [ sale, rent, all, freehold, leasehold ]
            default: all
        - name: world
          in: query
          required: false
          description: >-
            Restricts results to one world, given as a UUID or a name. A world
            name is a folder name on disk and may contain spaces or other
            characters requiring percent-encoding -- send the raw name
            percent-encoded, do not pre-decode it. Omit to search every world.
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          description: Inclusive lower price bound. Defaults to no lower bound.
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          description: Inclusive upper price bound. Defaults to no upper bound.
          schema:
            type: number
            minimum: 0
        - name: tag
          in: query
          required: false
          description: >-
            Repeatable. A region matches when it carries at least one of the
            given tags. Omit for no tag filter.
          schema:
            type: array
            items:
              type: string
        - name: occupancy
          in: query
          required: false
          description: >-
            `unoccupied` restricts to regions with no titleholder or tenant,
            `occupied` to those with one, `any` (the default) does not filter.
          schema:
            type: string
            enum: [ any, occupied, unoccupied ]
            default: any
        - name: sort
          in: query
          required: false
          description: Result order. Defaults to most expensive first.
          schema:
            type: string
            enum: [ price_desc, price_asc ]
            default: price_desc
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page of matching regions. An empty `results` array
            means nothing matched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: >-
            `INVALID_TYPE`, `INVALID_OCCUPANCY` or `INVALID_SORT` when that
            parameter is present but not one of its listed values;
            `INVALID_PRICE` when `minPrice` or `maxPrice` is not a finite number,
            is negative, or `minPrice` exceeds `maxPrice`; `INVALID_PAGE` or
            `INVALID_PAGE_SIZE` for a non-integer or out-of-range value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` when `world` names no known world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auctions:
    get:
      summary: Auctions currently taking bids
      operationId: listAuctions
      description: >-
        The browse form of `/realty auction info`, which is granted by default and
        already renders the auctioneer, minimum bid, minimum step and bidding
        duration to any player. `endDate` is computed in SQL as the last bid -- or
        the start, where there is none -- plus the bidding duration, which is also
        what `ending_soon` orders by, so paging cannot put an auction closing sooner
        on a later page.
      parameters:
        - name: world
          in: query
          required: false
          description: Narrow to one world, by name or UUID. Omitted lists every world.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            `ending_soon` (default) orders by the bidding deadline, soonest first.
            `highest_bid` orders by the standing bid, largest first, with an auction
            nobody has bid on ranking at its minimum bid.
          schema:
            type: string
            enum: [ ending_soon, highest_bid ]
            default: ending_soon
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `auctions` array means nothing is under the
            hammer, or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionsResponse"
        "400":
          description: "`INVALID_SORT`, `INVALID_PAGE` or `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- Realty has never seen that world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/leaderboard/owners:
    get:
      summary: Title holders ranked by plot count
      operationId: getOwnersLeaderboard
      description: >-
        Owners ranked highest first. Ownership is already public per player via
        `/realty list <player>`, so no row reveals anything new; what this route
        adds is the ranking, which no in-game command performs. Ties break on the
        title holder's UUID so the order is total and paging cannot repeat or skip
        an owner.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `owners` array means nobody holds a plot,
            or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnersLeaderboardResponse"
        "400":
          description: "`INVALID_PAGE` or `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/stats:
    get:
      summary: Server-wide totals
      operationId: getStats
      description: >-
        Aggregates over the whole estate: region and contract counts, occupancy,
        mean prices and the mean lease term. No player or region identity appears
        in the response. An empty server reports zeroes rather than nulls or
        absent fields, so a dashboard need not distinguish "no data" from
        "nothing registered yet".
      responses:
        "200":
          description: The current totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tags:
    get:
      summary: List every tag in use with its region count
      operationId: listTags
      description: >-
        Every tag id currently attached to at least one region, with how many
        regions carry it, so a consumer of `/v1/regions/search?tag=` can discover
        which values that filter accepts. Display names are deliberately absent --
        they live in the plugin's RealtyTags config, which this service does not
        read, and the `tags` array on a region reports raw ids for the same reason.
        Always 200; an empty array means no tag is in use.
      responses:
        "200":
          description: Every tag in use, in the order the backend reports them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/regions:
    get:
      summary: List a player's owned, landlorded and rented regions
      operationId: listPlayerRegions
      description: >-
        The HTTP form of the in-game `/realty list` command. When `category` is
        `all` (the default), the three category lists -- owned, landlord and
        rented -- are paged against **one shared offset**, exactly as `/realty
        list` does in-game: the page boundary can fall inside a category rather
        than starting each category's own list at 1, so `owned`, `landlord` and
        `rented` on a given page are the slice of the combined, concatenated
        sequence that lands on that page, not independently-paged lists of their
        own length. When `category` is `owned` or `rented`, that single category
        is paged normally and returned under `regions` instead.
      parameters:
        - name: playerId
          in: query
          required: false
          description: >-
            The player's UUID. Answered from the database alone, so this form keeps
            working while the query-service module is down -- the returned `name` is
            simply null, as every other module-sourced field degrades. Give exactly
            one of `playerId` or `playerName`.
          schema:
            type: string
            format: uuid
        - name: playerName
          in: query
          required: false
          description: >-
            The player's name, resolved through the query-service module. A Floodgate
            (Bedrock) player's name is a `.` followed by their Xbox gamertag, which
            may itself contain spaces -- send it percent-encoded, so `.Some Gamertag`
            becomes `.Some%20Gamertag`. Unlike `playerId` this needs the module, and
            so answers 404 for an unknown name and 502 when the module is unreachable.
            Give exactly one of `playerId` or `playerName`.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: One of `all` (default), `owned`, or `rented`.
          schema:
            type: string
            enum: [ all, owned, rented ]
            default: all
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The requested page of the player's regions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRegionsResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when neither `playerId` nor `playerName` was given;
            `AMBIGUOUS_PARAMETER` when both were; `MALFORMED_UUID` when `playerId`
            does not parse; `INVALID_PAGE` or `INVALID_PAGE_SIZE` for a non-integer
            or out-of-range `page`/`pageSize`; `INVALID_CATEGORY` when `category` is
            present but not one of `all`, `owned`, `rented`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- `playerName` names a player the server does not know."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `NAME_LOOKUP_UNAVAILABLE` -- `playerName` was given and the
            query-service module is not reachable. Never returned for `playerId`,
            which needs no module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/summary:
    get:
      summary: One player's holdings, as counts
      operationId: getPlayerSummary
      description: >-
        The counts behind `/realty list <player>`, which accepts any target and is
        granted by default, so this exposes nothing a passer-by could not already
        enumerate in game. It exists because counting via that listing means paging
        it to the last page purely to read a total. A player holding nothing is a
        200 with zeroes, not a 404: "nothing" is an answer, and there is no player
        resource here that could be missing.
      parameters:
        - name: playerId
          in: query
          required: false
          description: >-
            The player's UUID. Answered from the database alone, so this form keeps
            working while the query-service module is down -- the returned `name` is
            simply null, as every other module-sourced field degrades. Give exactly
            one of `playerId` or `playerName`.
          schema:
            type: string
            format: uuid
        - name: playerName
          in: query
          required: false
          description: >-
            The player's name, resolved through the query-service module. A Floodgate
            (Bedrock) player's name is a `.` followed by their Xbox gamertag, which
            may itself contain spaces -- send it percent-encoded, so `.Some Gamertag`
            becomes `.Some%20Gamertag`. Unlike `playerId` this needs the module, and
            so answers 404 for an unknown name and 502 when the module is unreachable.
            Give exactly one of `playerId` or `playerName`.
          schema:
            type: string
      responses:
        "200":
          description: The player's holdings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummaryResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when neither `playerId` nor `playerName` was given,
            `AMBIGUOUS_PARAMETER` when both were, or `MALFORMED_UUID`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- the module knows no player by that name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `NAME_LOOKUP_UNAVAILABLE` -- `playerName` was given and the module is
            unreachable. Never returned for `playerId`, which needs no module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/lookup:
    get:
      summary: Resolve a player name to a UUID
      operationId: lookupPlayer
      description: >-
        Bare name-to-UUID resolution, so a client holding only a name can resolve
        once and cache the UUID rather than paying the module hop on every
        player-scoped call. This is the one route whose entire answer comes from
        the query-service module: there is no partial answer to degrade to, so an
        unreachable module is a 502 rather than a null name.
      parameters:
        - name: playerName
          in: query
          required: true
          description: >-
            The player name to resolve. Percent-encode a name containing a space;
            a Floodgate player is its gamertag behind a leading `.`. Named to match
            the parameter every other player-scoped route takes.
          schema:
            type: string
      responses:
        "200":
          description: The resolved player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRef"
        "400":
          description: "`MISSING_PARAMETER` -- `playerName` was absent or blank."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- the module knows no player by that name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "`NAME_LOOKUP_UNAVAILABLE` -- the query-service module is disabled or unreachable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/openapi.yaml:
    get:
      summary: This document, as YAML
      operationId: getOpenApiYaml
      description: Serves the bundled openapi.yaml verbatim.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/openapi.json:
    get:
      summary: This document, as JSON
      operationId: getOpenApiJson
      description: >-
        The same document as `/v1/openapi.yaml`, parsed and re-serialised as
        JSON for tooling that prefers it.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
  /v1/docs:
    get:
      summary: Interactive API documentation
      operationId: getDocs
      description: >-
        A self-contained Swagger UI page (assets loaded from a CDN) that renders
        `/v1/openapi.yaml`.
      responses:
        "200":
          description: The Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    WorldRef:
      type: object
      description: >-
        A world identity. `id` is always present and stable; `name` is null for a
        world id the RealtyWorld table has never seen.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
      required: [ id ]
    PlayerRef:
      type: object
      description: A player identity. `id` is always present.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: From the query-service module; null when it is disabled or unreachable.
      required: [ id ]
    PlayerSummaryResponse:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        titleHeld:
          type: integer
        landlordOf:
          type: integer
        occupiedLandlordOf:
          type: integer
          description: >-
            The subset of `landlordOf` that currently has a tenant, so a caller can
            show let versus vacant without a second call.
        renting:
          type: integer
        authorityOver:
          type: integer
      required: [ player, titleHeld, landlordOf, occupiedLandlordOf, renting, authorityOver ]
    HistoryResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, entries ]
    HistoryResponse_Entry:
      type: object
      description: >-
        One event. `kind` decides which of the remaining fields are present; the
        others are omitted rather than sent as null, so a consumer cannot mistake
        "this kind has no such field" for "this field happened to be empty".
        Switch on `kind`: freehold carries buyer, authority and price; leasehold
        carries tenant, landlord and the lease terms; agent carries agent and actor.
      properties:
        kind:
          type: string
          enum: [ freehold, leasehold, agent ]
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
        buyer:
          $ref: "#/components/schemas/PlayerRef"
        authority:
          $ref: "#/components/schemas/PlayerRef"
        tenant:
          $ref: "#/components/schemas/PlayerRef"
        landlord:
          $ref: "#/components/schemas/PlayerRef"
        agent:
          $ref: "#/components/schemas/PlayerRef"
        actor:
          $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
        durationSeconds:
          type: integer
          format: int64
        extensionsRemaining:
          type: integer
      required: [ kind, eventType, eventTime ]
    AuctionsResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/AuctionsResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, auctions ]
    AuctionsResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        auctioneer:
          $ref: "#/components/schemas/PlayerRef"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          description: When bidding closes.
        minBid:
          type: number
        minStep:
          type: number
        biddingDurationSeconds:
          type: integer
          format: int64
        paymentDurationSeconds:
          type: integer
          format: int64
        highestBid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AuctionsResponse_Bid"
        bidderCount:
          type: integer
          description: How many distinct players have bid. Names nobody.
      required: [ worldGuardRegionId, world, auctioneer, startDate, endDate, minBid,
                  minStep, biddingDurationSeconds, paymentDurationSeconds, bidderCount ]
    AuctionsResponse_Bid:
      type: object
      properties:
        bidder:
          $ref: "#/components/schemas/PlayerRef"
        amount:
          type: number
        bidTime:
          type: string
          format: date-time
      required: [ bidder, amount, bidTime ]
    OwnersLeaderboardResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
          description: How many distinct players hold at least one plot.
        totalPages:
          type: integer
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnersLeaderboardResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, owners ]
    OwnersLeaderboardResponse_Entry:
      type: object
      properties:
        rank:
          type: integer
          description: >-
            The row's 1-based position across the whole leaderboard, not within the
            page, so page 2 at pageSize 10 starts at 11.
        player:
          $ref: "#/components/schemas/PlayerRef"
        plotCount:
          type: integer
      required: [ rank, player, plotCount ]
    StatsResponse:
      type: object
      properties:
        regions:
          type: integer
        freehold:
          $ref: "#/components/schemas/StatsResponse_Freehold"
        leasehold:
          $ref: "#/components/schemas/StatsResponse_Leasehold"
        activeOffers:
          type: integer
        activeAuctions:
          type: integer
      required: [ regions, freehold, leasehold, activeOffers, activeAuctions ]
    StatsResponse_Freehold:
      type: object
      properties:
        contracts:
          type: integer
        occupied:
          type: integer
          description: Freehold contracts that currently have a title holder.
        averagePrice:
          type: number
      required: [ contracts, occupied, averagePrice ]
    StatsResponse_Leasehold:
      type: object
      properties:
        contracts:
          type: integer
        occupied:
          type: integer
          description: Leasehold contracts that currently have a tenant.
        averagePrice:
          type: number
        averageDurationSeconds:
          type: integer
          format: int64
          description: The mean lease term, in whole seconds.
      required: [ contracts, occupied, averagePrice, averageDurationSeconds ]
    TagResponse:
      type: object
      description: A tag id in use, and how many regions carry it.
      properties:
        id:
          type: string
        regionCount:
          type: integer
      required: [ id, regionCount ]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A stable, machine-readable error code (e.g. `WORLD_NOT_FOUND`).
        message:
          type: string
          description: A human-readable message. Never the raw text of an internal exception.
      required: [ error, message ]
    RegionResponse:
      type: object
      description: The region payload, mirroring what `/realty info` renders.
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        state:
          type: string
          nullable: true
        freehold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Freehold"
        leasehold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Leasehold"
        auction:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Auction"
        dimensions:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Dimensions"
        tags:
          type: array
          items:
            type: string
      required: [ worldGuardRegionId, world, tags ]
    RegionResponse_Freehold:
      type: object
      properties:
        titleHolder:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerRef"
        authority:
          $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
          nullable: true
          description: Null means the region is not currently for sale.
        lastSoldPrice:
          type: number
          nullable: true
        acceptingOffers:
          type: boolean
          description: Whether the title holder is currently taking offers on this plot.
      required: [ authority, acceptingOffers ]
    RegionResponse_Leasehold:
      type: object
      properties:
        landlord:
          $ref: "#/components/schemas/PlayerRef"
        tenant:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
        durationSeconds:
          type: integer
          format: int64
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        extensionsUsed:
          type: integer
          nullable: true
        maxExtensions:
          type: integer
          nullable: true
          description: Null means unlimited extensions.
        terminationEffectiveDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null unless a party has given notice. The lease still runs until this
            date, so a consumer should read it as "ending", not "ended".
        terminatedByRole:
          type: string
          nullable: true
          description: Which party gave notice. Null alongside a null terminationEffectiveDate.
        acceptingTenants:
          type: boolean
          description: Whether the landlord is currently taking a new tenant.
      required: [ landlord, price, durationSeconds, acceptingTenants ]
    RegionResponse_Auction:
      type: object
      properties:
        endDate:
          type: string
          format: date-time
          nullable: true
        highestBid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Bid"
        auctioneer:
          $ref: "#/components/schemas/PlayerRef"
        startDate:
          type: string
          format: date-time
        minBid:
          type: number
        minStep:
          type: number
          description: The smallest amount by which a new bid must beat the standing one.
        biddingDurationSeconds:
          type: integer
          format: int64
          description: >-
            How long bidding stays open past the last bid. `endDate` is this added
            to the last bid's time, or to `startDate` when nobody has bid.
        paymentDurationSeconds:
          type: integer
          format: int64
          description: How long the winner then has to pay.
      required: [ auctioneer, startDate, minBid, minStep, biddingDurationSeconds, paymentDurationSeconds ]
    RegionResponse_Bid:
      type: object
      properties:
        bidder:
          $ref: "#/components/schemas/PlayerRef"
        amount:
          type: number
      required: [ bidder, amount ]
    Dimensions:
      type: object
      nullable: true
      description: >-
        A region's WorldGuard geometry. Null when the query-service module is
        disabled or unreachable.
      properties:
        shape:
          type: string
          enum: [ CUBOID, POLYGONAL ]
        minY:
          type: integer
        maxY:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/Dimensions_Point"
      required: [ shape, minY, maxY, points ]
    Dimensions_Point:
      type: object
      properties:
        x:
          type: integer
        z:
          type: integer
      required: [ x, z ]
    PlayerRegionsResponse:
      type: object
      description: >-
        The response for GET /v1/players/regions. When category=owned or
        category=rented was requested, `regions` carries that category's entries
        and `owned`/`landlord`/`rented` are omitted (not serialised as null).
        When category=all (the default), `owned`, `landlord` and `rented` are
        populated instead and `regions` is omitted. See the endpoint description
        for the shared-offset paging behaviour of category=all.
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        owned:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RegionRef"
        landlord:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RegionRef"
        rented:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RentedRef"
        regions:
          type: array
          description: >-
            Present only for a single-category request (category=owned or
            category=rented); its entries are RegionRef or RentedRef shaped
            per that category.
          items: {}
      required: [ player, page, pageSize, totalCount, totalPages ]
    PlayerRegionsResponse_RegionRef:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
      required: [ worldGuardRegionId, world ]
    PlayerRegionsResponse_RentedRef:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        endDate:
          type: string
          format: date-time
          nullable: true
        secondsRemaining:
          type: integer
          format: int64
          nullable: true
      required: [ worldGuardRegionId, world ]
    SearchResponse:
      type: object
      description: >-
        A page of search results. `results` is empty rather than absent when
        nothing matched.
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResponse_Result"
      required: [ page, pageSize, totalCount, totalPages, results ]
    SearchResponse_Result:
      type: object
      description: >-
        One matching region, as the search projection reports it. Deliberately
        minimal -- a browse listing shows identity, type and price, and fetches
        `/v1/regions` for the row a user opens.
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        contractType:
          type: string
          enum: [ freehold, leasehold ]
        price:
          type: [ number, "null" ]
          description: >-
            The asking price, or null for a freehold that is not currently for
            sale. Null only appears under `type=freehold`.
        state:
          type: string
          enum: [ FOR_SALE, SOLD, FOR_LEASE, LEASED ]
          description: >-
            Never null here: a search result matched on a contract, so it always
            has a state. Contrast `/v1/regions`, which lists contractless regions
            too and reports null for them.
      required: [ worldGuardRegionId, world, contractType, price, state ]
    RegionListResponse:
      type: object
      description: >-
        A page of registered regions. Entries carry identity only; `/v1/region`
        returns a single region's contracts, auction and tags.
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionListResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, regions ]
    RegionListResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        state:
          type: [ string, "null" ]
          description: >-
            The region's state, so a browse grid need not call `/v1/region` once
            per row to learn it. Null for a registered region carrying no
            contract at all -- which `/v1/regions` lists and `/v1/regions/search`
            does not.
      required: [ worldGuardRegionId, world, state ]
