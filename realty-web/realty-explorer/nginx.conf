# Serves the built explorer, and fronts the API on the same origin.
#
# Proxying /v1 rather than letting the browser call the API directly is what makes
# CORS unnecessary here: the page and its requests share one origin, so
# REALTY_REST_CORS_ORIGINS can stay empty -- its safe default. It is also why no
# config.json is written: an absent one means "same origin" to the app.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, forwarded to the service named in the compose file.
    location /v1/ {
        proxy_pass http://realty-rest:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Schematics are megabytes and stream as one body.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed assets are immutable -- the filename changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA. Without this a deep link such as
    # /region/world/plot_a would 404: the router runs in the browser, and nginx
    # has no file at that path.
    location / {
        try_files $uri /index.html;
    }
}
