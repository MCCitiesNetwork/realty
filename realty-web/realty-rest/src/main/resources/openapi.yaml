openapi: 3.0.3
info:
  title: Realty REST API
  description: >-
    Read-only HTTP surface over Realty's region economy data. This service never
    migrates or writes -- every endpoint is backed by query methods only.
  version: "1.0"
servers:
  - url: /
paths:
  /v1/health:
    get:
      summary: Liveness/readiness check
      operationId: getHealth
      description: >-
        Reports whether the database is reachable. Intended for load-balancer and
        orchestrator health probes, not for consumers of the data endpoints below.
      responses:
        "200":
          description: >-
            The service is up and the database is reachable. `module` reports the
            query-service module's own status separately -- an unreachable module
            is a degraded enrichment source, not an unhealthy service, so it never
            turns this response into a 503.
          content:
            application/json:
              schema:
                type: object
                required: [ status, module ]
                properties:
                  status:
                    type: string
                    enum: [ ok ]
                  module:
                    type: string
                    enum: [ ok, unreachable, disabled ]
        "503":
          description: The database could not be reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ degraded ]
  /v1/worlds:
    get:
      summary: List every world known to Realty
      operationId: listWorlds
      description: >-
        Returns every row of the RealtyWorld table. Always 200; an empty array
        means no world has ever been registered.
      responses:
        "200":
          description: The full list of known worlds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldRef"
  /v1/region:
    get:
      summary: Look up a single region
      operationId: getRegion
      description: The HTTP form of the in-game `/realty info` command.
      parameters:
        - name: world
          in: query
          required: true
          description: >-
            A world's UUID or its name. A world name is a folder name on disk and
            may contain spaces or other characters requiring percent-encoding
            (for example `My World` becomes `My%20World`, or `+` may be used in
            place of a space) -- send the raw name percent-encoded, do not
            pre-decode it.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id, exactly as WorldGuard stores it.
          schema:
            type: string
      responses:
        "200":
          description: The region's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when `world` or `region` is absent or blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `WORLD_NOT_FOUND` when `world` names no known world; `REGION_NOT_FOUND`
            when the region does not exist in that world.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/region/history:
    get:
      summary: One region's history
      operationId: getRegionHistory
      description: >-
        The HTTP form of `/realty history`, which is granted by default and accepts
        any region. Also answers the questions that would otherwise want routes of
        their own: a region's price history is `type=BUY`, and who has rented it
        before is `type=RENT`. A region nobody has traded is a 200 with an empty
        `entries` array, not a 404.
      parameters:
        - name: world
          in: query
          required: true
          description: A world name or UUID.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: >-
            Restrict to one event type. Case-insensitive; an unrecognised value is
            rejected rather than ignored, so a typo does not silently return
            everything.
          schema:
            type: string
            enum: [ BUY, AUCTION_BUY, OFFER_BUY, AGENT_ADD, AGENT_REMOVE, RENT, UNRENT,
                    RENEW, LEASEHOLD_EXPIRY, SET_PRICE, UNSET_PRICE, SET_TITLEHOLDER,
                    UNSET_TITLEHOLDER, SET_DURATION, SET_LANDLORD, SET_TENANT,
                    UNSET_TENANT, SET_MAX_EXTENSIONS, MODIFY_PROPOSE, MODIFY_ACCEPT,
                    MODIFY_REJECT, MODIFY_WITHDRAW, MODIFY_APPLY, TERMINATE,
                    TERMINATION_CANCEL ]
        - name: since
          in: query
          required: false
          description: >-
            Only events at or after this instant. Must carry an offset (`Z` or
            `+hh:mm`): a bare local date-time is rejected rather than assumed to be
            UTC, since assuming would shift a caller's window by hours in silence.
            The command takes a relative duration instead; `now - duration` is a
            trivial conversion on the client.
          schema:
            type: string
            format: date-time
        - name: player
          in: query
          required: false
          description: >-
            Only events this player took part in, given as a UUID or a name. A UUID
            needs no module; a name is resolved through the query-service module, so
            it answers 404 for an unknown name and 502 when the module is
            unreachable. Omit to not filter by player.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The requested page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: >-
            `MISSING_PARAMETER`, `INVALID_EVENT_TYPE`, `INVALID_SINCE`,
            `MALFORMED_UUID` (a UUID-shaped `player` that does not parse),
            `INVALID_PAGE` or `INVALID_PAGE_SIZE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- Realty has never seen that world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/regions:
    get:
      summary: List every registered region
      operationId: listRegions
      description: >-
        A page of every region Realty has registered, whether or not it carries a
        contract, in a fixed total order (WorldGuard region id, then world id,
        then internal row id) so that paging cannot repeat or skip a row. Entries
        are identity only -- use `/v1/region` for one region's full state, or
        `/v1/regions/search` to browse what is actually on the market.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `regions` array means no region is
            registered, or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionListResponse"
        "400":
          description: >-
            `INVALID_PAGE` or `INVALID_PAGE_SIZE` for a non-integer or
            out-of-range value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/regions/search:
    get:
      summary: Search regions by type, world, price, tags and occupancy
      operationId: searchRegions
      description: >-
        The bulk browse endpoint, backed by the same query as the in-game
        `/realty search` dialog. Every filter is optional; with none given it
        returns every region carrying a contract, most expensive first. A result
        carries only identity, contract type and price -- fetch `/v1/regions` for
        a single region's full state. No match is a 200 with an empty `results`
        array, never a 404.
      parameters:
        - name: type
          in: query
          required: false
          description: >-
            Which contracts to search. `sale` is freeholds with an asking price,
            `rent` is leaseholds, and `all` (the default) is both -- the market
            view, matching the in-game `/realty search`. `freehold` widens to
            every freehold contract, including sold or never-listed regions,
            which come back with a null `price`; the price bounds apply only to
            the priced rows, since an unpriced one has nothing to compare.
            `leasehold` is every leasehold contract, which is the same set as
            `rent` because a lease always carries a price.
          schema:
            type: string
            enum: [ sale, rent, all, freehold, leasehold ]
            default: all
        - name: world
          in: query
          required: false
          description: >-
            Restricts results to one world, given as a UUID or a name. A world
            name is a folder name on disk and may contain spaces or other
            characters requiring percent-encoding -- send the raw name
            percent-encoded, do not pre-decode it. Omit to search every world.
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          description: Inclusive lower price bound. Defaults to no lower bound.
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          description: Inclusive upper price bound. Defaults to no upper bound.
          schema:
            type: number
            minimum: 0
        - name: tag
          in: query
          required: false
          description: >-
            Repeatable. A region matches when it carries at least one of the
            given tags. Omit for no tag filter.
          schema:
            type: array
            items:
              type: string
        - name: occupancy
          in: query
          required: false
          description: >-
            `unoccupied` restricts to regions with no titleholder or tenant,
            `occupied` to those with one, `any` (the default) does not filter.
          schema:
            type: string
            enum: [ any, occupied, unoccupied ]
            default: any
        - name: sort
          in: query
          required: false
          description: Result order. Defaults to most expensive first.
          schema:
            type: string
            enum: [ price_desc, price_asc ]
            default: price_desc
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page of matching regions. An empty `results` array
            means nothing matched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: >-
            `INVALID_TYPE`, `INVALID_OCCUPANCY` or `INVALID_SORT` when that
            parameter is present but not one of its listed values;
            `INVALID_PRICE` when `minPrice` or `maxPrice` is not a finite number,
            is negative, or `minPrice` exceeds `maxPrice`; `INVALID_PAGE` or
            `INVALID_PAGE_SIZE` for a non-integer or out-of-range value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` when `world` names no known world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/activity:
    get:
      summary: A server-wide feed of recent events
      operationId: getActivity
      description: >-
        Recent events across every region, newest first. Each event is individually
        obtainable in game -- `/realty history` is granted by default and accepts any
        region -- but no command performs the sweep across regions, so this is the
        aggregation the v1.x spec flags rather than plainly public data. The default
        type set is the sales-and-lettings ticker (`BUY`, `AUCTION_BUY`, `OFFER_BUY`,
        `RENT`); naming types explicitly gives the full audit trail.
      parameters:
        - name: type
          in: query
          required: false
          description: >-
            Repeatable. Restrict the feed to these event types. Omitted entirely, the
            default ticker set applies; an unrecognised value is rejected rather than
            ignored.
          schema:
            type: array
            items:
              type: string
        - name: world
          in: query
          required: false
          description: Narrow to one world, by name or UUID.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >-
            Only events at or after this instant. Must carry an offset; a bare local
            date-time is rejected rather than assumed to be UTC.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The requested page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
        "400":
          description: "`INVALID_EVENT_TYPE`, `INVALID_SINCE`, `INVALID_PAGE` or `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- Realty has never seen that world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auctions:
    get:
      summary: Auctions currently taking bids
      operationId: listAuctions
      description: >-
        The browse form of `/realty auction info`, which is granted by default and
        already renders the auctioneer, minimum bid, minimum step and bidding
        duration to any player. `endDate` is computed in SQL as the last bid -- or
        the start, where there is none -- plus the bidding duration, which is also
        what `ending_soon` orders by, so paging cannot put an auction closing sooner
        on a later page.
      parameters:
        - name: world
          in: query
          required: false
          description: Narrow to one world, by name or UUID. Omitted lists every world.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            `ending_soon` (default) orders by the bidding deadline, soonest first.
            `highest_bid` orders by the standing bid, largest first, with an auction
            nobody has bid on ranking at its minimum bid.
          schema:
            type: string
            enum: [ ending_soon, highest_bid ]
            default: ending_soon
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `auctions` array means nothing is under the
            hammer, or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionsResponse"
        "400":
          description: "`INVALID_SORT`, `INVALID_PAGE` or `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- Realty has never seen that world."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/leaderboard/owners:
    get:
      summary: Title holders ranked by plot count
      operationId: getOwnersLeaderboard
      description: >-
        Owners ranked highest first. Ownership is already public per player via
        `/realty list <player>`, so no row reveals anything new; what this route
        adds is the ranking, which no in-game command performs. Ties break on the
        title holder's UUID so the order is total and paging cannot repeat or skip
        an owner.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            The requested page. An empty `owners` array means nobody holds a plot,
            or the page lies beyond the last one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnersLeaderboardResponse"
        "400":
          description: "`INVALID_PAGE` or `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/stats:
    get:
      summary: Server-wide totals
      operationId: getStats
      description: >-
        Aggregates over the whole estate: region and contract counts, occupancy,
        mean prices and the mean lease term. No player or region identity appears
        in the response. An empty server reports zeroes rather than nulls or
        absent fields, so a dashboard need not distinguish "no data" from
        "nothing registered yet".
      responses:
        "200":
          description: The current totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tags:
    get:
      summary: List every tag in use with its region count
      operationId: listTags
      description: >-
        Every tag id currently attached to at least one region, with how many
        regions carry it, so a consumer of `/v1/regions/search?tag=` can discover
        which values that filter accepts. Display names are deliberately absent --
        they live in the plugin's RealtyTags config, which this service does not
        read, and the `tags` array on a region reports raw ids for the same reason.
        Always 200; an empty array means no tag is in use.
      responses:
        "200":
          description: Every tag in use, in the order the backend reports them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/regions/at:
    get:
      summary: Which registered regions contain a block
      operationId: regionsAt
      description: >-
        A point or column lookup, for a map click or a "what plot am I standing
        on" bot command. `y` is optional and the two forms are different
        questions rather than one with a default: with `y` this is a true point
        test at that block, so a region whose vertical band excludes the point
        does not match; without it, a column test matching every region whose
        horizontal footprint covers `(x, z)` at any height. The response's `test`
        field says which ran, so a consumer never has to infer it from whether it
        remembered to send `y`. `y` is deliberately not defaulted to the build
        floor or sea level, either of which would answer the column question
        wrongly on a server using vertical subdivision.


        WorldGuard's answer is intersected with the regions Realty manages, so an
        unregistered WorldGuard region never appears. A block inside no
        registered region is a 200 with an empty `regions` array, never a 404.


        The list leads with the region WorldGuard itself would apply to the
        block, highest priority first, so a caller wanting the one answer rather
        than all of them can take the first entry. Both forms are answered from
        WorldGuard's spatial index rather than by reading every region in the
        world, so what this costs the game server does not grow as the world
        fills up.


        Answered entirely by the query-service module, so an unreachable module
        is a 502 rather than a degraded response.
      parameters:
        - name: world
          in: query
          required: true
          description: The world, as a UUID or a name.
          schema:
            type: string
        - name: x
          in: query
          required: true
          description: Block X coordinate.
          schema:
            type: integer
        - name: z
          in: query
          required: true
          description: Block Z coordinate.
          schema:
            type: integer
        - name: y
          in: query
          required: false
          description: >-
            Block Y coordinate. Omit for a column test. An empty value is treated
            as omitted, so a client templating the query string with nothing to
            substitute asks the column question rather than getting a 400.
          schema:
            type: integer
      responses:
        "200":
          description: The regions covering that block, in WorldGuard's own region order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionsAtResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when `world` is absent, or `INVALID_COORDINATE`
            when `x` or `z` is absent, or any of the three is not a whole number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- no world of that name or id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `GEOMETRY_UNAVAILABLE` -- the query-service module is disabled or
            unreachable, and this route has no database-only answer to fall back
            on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/region/members:
    get:
      summary: A region's WorldGuard owners and members
      operationId: regionMembers
      description: >-
        The owner and member domains WorldGuard holds for the region, which are
        distinct from Realty's own title holder and tenant.


        Each domain keeps WorldGuard's three kinds of entry apart rather than
        flattening them. `players` are UUID entries, named where the module could
        name them; `playerNames` are legacy name entries, which carry no id at
        all and which WorldGuard lower-cases on the way in; `groups` are
        permission groups, which are not players. A region configured the legacy
        way would otherwise report an empty owner list.


        The region must be one Realty manages: an unregistered WorldGuard region
        is a 404 here rather than a pass-through. Answered entirely by the
        query-service module, so an unreachable module is a 502.
      parameters:
        - name: world
          in: query
          required: true
          description: The world, as a UUID or a name.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id.
          schema:
            type: string
      responses:
        "200":
          description: Both domains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionMembersResponse"
        "400":
          description: "`MISSING_PARAMETER` -- `world` or `region` was not given."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `WORLD_NOT_FOUND`, or `REGION_NOT_FOUND` when Realty does not manage
            that region or WorldGuard no longer holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `MEMBERS_UNAVAILABLE` -- the query-service module is disabled or
            unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/region/schematic:
    get:
      summary: A region's captured schematic
      operationId: regionSchematic
      description: >-
        The raw Sponge Schematic v3 bytes for the region, as captured in game by
        `/realty schematic capture`. Served as bytes rather than JSON because the
        browser-side renderers read an `ArrayBuffer` directly; base64 in JSON
        would cost a third more bytes and a decode step for nothing.


        The schematic records block state only -- a stair's facing, a slab's half
        -- and deliberately not block entity NBT. Chests render as chests, but
        their contents are never captured and so are never served here.


        Capturing is on demand, so a region Realty manages may legitimately have
        no schematic yet; that is a 404 rather than an empty body.
      parameters:
        - name: world
          in: query
          required: true
          description: The world, as a UUID or a name.
          schema:
            type: string
        - name: region
          in: query
          required: true
          description: The WorldGuard region id.
          schema:
            type: string
      responses:
        "200":
          description: The schematic bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: "`MISSING_PARAMETER` -- `world` or `region` was not given."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `WORLD_NOT_FOUND`, or `SCHEMATIC_NOT_FOUND` when the region has never
            been captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/resource-pack:
    get:
      summary: The resource pack for texturing previews
      operationId: resourcePack
      description: >-
        Where to fetch the resource packs a browser-side renderer should texture
        previews with, highest priority first, named by the query-service module's
        `resource-packs` setting.


        Locations only -- the URLs -- never any pack's bytes.
        That URL is already public, since every joining player receives it, so
        reporting it redistributes nothing; serving the pack through this service
        would mean redistributing whatever assets it contains.


        `url` is null when the operator has configured no pack, which is the default.
        That is a normal answer rather than an error, but note what it costs: without
        a pack a renderer does not draw blocks untextured, it does not draw most of
        them at all, because their block models carry no geometry. A plot then looks
        like a failed capture.


        This is deliberately not server.properties' `resource-pack`. That pack is sent
        to the game client, which applies it over its own copy of the game, so it is
        usually an override pack; a browser has no vanilla assets underneath it. Name a
        pack that stands on its own.


        Answered entirely by the query-service module, because the setting lives with
        the game server and not in this service's database. An unreachable module is
        therefore a 502 rather than an empty pack: "none configured" and "could not
        ask" are different answers.
      responses:
        "200":
          description: The configured pack, or nulls when none is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePackResponse"
        "502":
          description: >-
            `RESOURCE_PACK_UNAVAILABLE` -- the query-service module is disabled or
            unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/worlds/geometry:
    get:
      summary: Every registered region's footprint in one world
      operationId: worldGeometry
      description: >-
        For drawing a map overlay, so a client should use this instead of looping
        `/v1/region`. A footprint can only be measured on the game server's main
        thread, and this route is shaped so that measuring costs that thread as
        little as possible: a world is read whole rather than a page at a time,
        the reading is kept and reused for
        `REALTY_REST_GEOMETRY_CACHE_SECONDS`, and the reading itself is spread
        across ticks rather than spending one entirely. Paging through a world,
        and every visitor after the first, therefore costs the game server
        nothing. A footprint may accordingly be up to that term out of date;
        which regions are registered is never cached and is always current.


        Unlike the other two module-backed routes, geometry here is enrichment
        rather than the whole answer: the region list comes from the database, so
        an unreachable module yields the page with every `dimensions` null rather
        than a 502 -- the same degradation `/v1/region` already applies. A
        `dimensions` of null therefore means either that, or a region Realty has
        registered which WorldGuard no longer holds.
      parameters:
        - name: world
          in: query
          required: true
          description: The world, as a UUID or a name.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Rows per page, defaulting to 10 and clamped to the operator's
            configured maximum.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: One page of the world's registered regions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldGeometryResponse"
        "400":
          description: >-
            `MISSING_PARAMETER`, `INVALID_PAGE` or `INVALID_PAGE_SIZE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`WORLD_NOT_FOUND` -- no world of that name or id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/regions:
    get:
      summary: List a player's owned, landlorded and rented regions
      operationId: listPlayerRegions
      description: >-
        The HTTP form of the in-game `/realty list` command. When `category` is
        `all` (the default), the three category lists -- owned, landlord and
        rented -- are paged against **one shared offset**, exactly as `/realty
        list` does in-game: the page boundary can fall inside a category rather
        than starting each category's own list at 1, so `owned`, `landlord` and
        `rented` on a given page are the slice of the combined, concatenated
        sequence that lands on that page, not independently-paged lists of their
        own length. When `category` is `owned` or `rented`, that single category
        is paged normally and returned under `regions` instead.
      parameters:
        - name: player
          in: query
          required: true
          description: >-
            The player, as a UUID or a name. A UUID is answered from the database
            alone, so this form keeps working while the query-service module is
            down -- the returned `name` is simply null, as every other
            module-sourced field degrades. A name is resolved through the module,
            so it answers 404 for an unknown name and 502 when the module is
            unreachable. A Floodgate (Bedrock) player's name is a `.` followed by
            their Xbox gamertag, which may itself contain spaces -- send it
            percent-encoded, so `.Some Gamertag` becomes `.Some%20Gamertag`.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: One of `all` (default), `owned`, or `rented`.
          schema:
            type: string
            enum: [ all, owned, rented ]
            default: all
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Page size, clamped to the server's configured maximum, which is itself
            capped at 100. Defaults to 10 (or the configured maximum if it is
            lower). A larger value is clamped rather than rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The requested page of the player's regions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRegionsResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when `player` was not given; `MALFORMED_UUID` when
            a UUID-shaped `player` does not parse; `INVALID_PAGE` or
            `INVALID_PAGE_SIZE` for a non-integer or out-of-range `page`/`pageSize`;
            `INVALID_CATEGORY` when `category` is present but not one of `all`,
            `owned`, `rented`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- `player` names a player the server does not know."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `NAME_LOOKUP_UNAVAILABLE` -- `player` was given as a name and the
            query-service module is not reachable. Never returned for a
            UUID-shaped `player`, which needs no module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/summary:
    get:
      summary: One player's holdings, as counts
      operationId: getPlayerSummary
      description: >-
        The counts behind `/realty list <player>`, which accepts any target and is
        granted by default, so this exposes nothing a passer-by could not already
        enumerate in game. It exists because counting via that listing means paging
        it to the last page purely to read a total. A player holding nothing is a
        200 with zeroes, not a 404: "nothing" is an answer, and there is no player
        resource here that could be missing.
      parameters:
        - name: player
          in: query
          required: true
          description: >-
            The player, as a UUID or a name. A UUID is answered from the database
            alone, so this form keeps working while the query-service module is
            down -- the returned `name` is simply null, as every other
            module-sourced field degrades. A name is resolved through the module,
            so it answers 404 for an unknown name and 502 when the module is
            unreachable. A Floodgate (Bedrock) player's name is a `.` followed by
            their Xbox gamertag, which may itself contain spaces -- send it
            percent-encoded, so `.Some Gamertag` becomes `.Some%20Gamertag`.
          schema:
            type: string
      responses:
        "200":
          description: The player's holdings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummaryResponse"
        "400":
          description: >-
            `MISSING_PARAMETER` when `player` was not given, or `MALFORMED_UUID`
            when a UUID-shaped `player` does not parse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- the module knows no player by that name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `NAME_LOOKUP_UNAVAILABLE` -- `player` was given as a name and the
            module is unreachable. Never returned for a UUID-shaped `player`,
            which needs no module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/players/lookup:
    get:
      summary: Resolve a player name to a UUID
      operationId: lookupPlayer
      description: >-
        Bare name-to-UUID resolution, so a client holding only a name can resolve
        once and cache the UUID rather than paying the module hop on every
        player-scoped call. This is the one route whose entire answer comes from
        the query-service module: there is no partial answer to degrade to, so an
        unreachable module is a 502 rather than a null name.
      parameters:
        - name: playerName
          in: query
          required: true
          description: >-
            The player name to resolve. Percent-encode a name containing a space;
            a Floodgate player is its gamertag behind a leading `.`. This route
            always takes a name -- resolving a UUID you already hold has no
            purpose -- so it keeps its own parameter name rather than the `player`
            every other player-scoped route takes, which accepts either.
          schema:
            type: string
      responses:
        "200":
          description: The resolved player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRef"
        "400":
          description: "`MISSING_PARAMETER` -- `playerName` was absent or blank."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`PLAYER_NOT_FOUND` -- the module knows no player by that name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`INTERNAL_ERROR` -- a generic message only, never the underlying exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "`NAME_LOOKUP_UNAVAILABLE` -- the query-service module is disabled or unreachable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/openapi.yaml:
    get:
      summary: This document, as YAML
      operationId: getOpenApiYaml
      description: Serves the bundled openapi.yaml verbatim.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/openapi.json:
    get:
      summary: This document, as JSON
      operationId: getOpenApiJson
      description: >-
        The same document as `/v1/openapi.yaml`, parsed and re-serialised as
        JSON for tooling that prefers it.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
  /v1/docs:
    get:
      summary: Interactive API documentation
      operationId: getDocs
      description: >-
        A self-contained Swagger UI page (assets loaded from a CDN) that renders
        `/v1/openapi.yaml`.
      responses:
        "200":
          description: The Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    WorldRef:
      type: object
      description: >-
        A world identity. `id` is always present and stable; `name` is null for a
        world id the RealtyWorld table has never seen.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
      required: [ id ]
    PlayerRef:
      type: object
      description: A player identity. `id` is always present.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: From the query-service module; null when it is disabled or unreachable.
      required: [ id ]
    PlayerSummaryResponse:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        titleHeld:
          type: integer
        landlordOf:
          type: integer
        occupiedLandlordOf:
          type: integer
          description: >-
            The subset of `landlordOf` that currently has a tenant, so a caller can
            show let versus vacant without a second call.
        renting:
          type: integer
        authorityOver:
          type: integer
      required: [ player, titleHeld, landlordOf, occupiedLandlordOf, renting, authorityOver ]
    HistoryResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, entries ]
    HistoryResponse_Entry:
      type: object
      description: >-
        One event. `kind` decides which of the remaining fields are present; the
        others are omitted rather than sent as null, so a consumer cannot mistake
        "this kind has no such field" for "this field happened to be empty".
        Switch on `kind`: freehold carries buyer, authority and price; leasehold
        carries tenant, landlord and the lease terms; agent carries agent and actor.
      properties:
        kind:
          type: string
          enum: [ freehold, leasehold, agent ]
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
        buyer:
          $ref: "#/components/schemas/PlayerRef"
        authority:
          $ref: "#/components/schemas/PlayerRef"
        tenant:
          $ref: "#/components/schemas/PlayerRef"
        landlord:
          $ref: "#/components/schemas/PlayerRef"
        agent:
          $ref: "#/components/schemas/PlayerRef"
        actor:
          $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
        durationSeconds:
          type: integer
          format: int64
        extensionsRemaining:
          type: integer
      required: [ kind, eventType, eventTime ]
    ActivityResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityResponse_Event"
      required: [ page, pageSize, totalCount, totalPages, events ]
    ActivityResponse_Event:
      type: object
      description: >-
        The same polymorphic shape as HistoryResponse_Entry, with the region and world
        added since a server-wide feed must say where each event happened. `kind`
        decides which party and detail fields are present; the others are omitted
        rather than sent as null.
      properties:
        kind:
          type: string
          enum: [ freehold, leasehold, agent ]
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        buyer:
          $ref: "#/components/schemas/PlayerRef"
        authority:
          $ref: "#/components/schemas/PlayerRef"
        tenant:
          $ref: "#/components/schemas/PlayerRef"
        landlord:
          $ref: "#/components/schemas/PlayerRef"
        agent:
          $ref: "#/components/schemas/PlayerRef"
        actor:
          $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
        durationSeconds:
          type: integer
          format: int64
        extensionsRemaining:
          type: integer
      required: [ kind, eventType, eventTime, worldGuardRegionId, world ]
    AuctionsResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        auctions:
          type: array
          items:
            $ref: "#/components/schemas/AuctionsResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, auctions ]
    AuctionsResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        auctioneer:
          $ref: "#/components/schemas/PlayerRef"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          description: When bidding closes.
        minBid:
          type: number
        minStep:
          type: number
        biddingDurationSeconds:
          type: integer
          format: int64
        paymentDurationSeconds:
          type: integer
          format: int64
        highestBid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AuctionsResponse_Bid"
        bidderCount:
          type: integer
          description: How many distinct players have bid. Names nobody.
      required: [ worldGuardRegionId, world, auctioneer, startDate, endDate, minBid,
                  minStep, biddingDurationSeconds, paymentDurationSeconds, bidderCount ]
    AuctionsResponse_Bid:
      type: object
      properties:
        bidder:
          $ref: "#/components/schemas/PlayerRef"
        amount:
          type: number
        bidTime:
          type: string
          format: date-time
      required: [ bidder, amount, bidTime ]
    OwnersLeaderboardResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
          description: How many distinct players hold at least one plot.
        totalPages:
          type: integer
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnersLeaderboardResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, owners ]
    OwnersLeaderboardResponse_Entry:
      type: object
      properties:
        rank:
          type: integer
          description: >-
            The row's 1-based position across the whole leaderboard, not within the
            page, so page 2 at pageSize 10 starts at 11.
        player:
          $ref: "#/components/schemas/PlayerRef"
        plotCount:
          type: integer
      required: [ rank, player, plotCount ]
    StatsResponse:
      type: object
      properties:
        regions:
          type: integer
        freehold:
          $ref: "#/components/schemas/StatsResponse_Freehold"
        leasehold:
          $ref: "#/components/schemas/StatsResponse_Leasehold"
        activeOffers:
          type: integer
        activeAuctions:
          type: integer
      required: [ regions, freehold, leasehold, activeOffers, activeAuctions ]
    StatsResponse_Freehold:
      type: object
      properties:
        contracts:
          type: integer
        occupied:
          type: integer
          description: Freehold contracts that currently have a title holder.
        averagePrice:
          type: number
      required: [ contracts, occupied, averagePrice ]
    StatsResponse_Leasehold:
      type: object
      properties:
        contracts:
          type: integer
        occupied:
          type: integer
          description: Leasehold contracts that currently have a tenant.
        averagePrice:
          type: number
        averageDurationSeconds:
          type: integer
          format: int64
          description: The mean lease term, in whole seconds.
      required: [ contracts, occupied, averagePrice, averageDurationSeconds ]
    TagResponse:
      type: object
      description: A tag id in use, and how many regions carry it.
      properties:
        id:
          type: string
        regionCount:
          type: integer
      required: [ id, regionCount ]
    ResourcePackResponse:
      type: object
      required: [packs, hash, required]
      properties:
        packs:
          type: array
          description: >-
            Every pack the renderer should texture previews with, **highest priority
            first**. Empty when the server configures none, which is the default.


            A list rather than one pack because a pack is usually authored to sit on top
            of another. The pack a server sends to the game client overrides the client's
            own copy of the game, so alone in a browser it draws almost nothing; a base
            pack listed beneath it supplies what the client would have had. A renderer
            merges the list and resolves a texture two packs both provide in favour of
            the earlier one.
          items:
            $ref: "#/components/schemas/ResourcePackEntry"
        hash:
          type: string
          nullable: true
          description: >-
            Reserved; always null. A browser has nothing to verify a pack against, so
            no hash is configured or reported.
        required:
          type: boolean
          description: Reserved; always false. A preview cannot compel a download.
    ResourcePackEntry:
      type: object
      required: [url, attribution]
      description: One resource pack, and the credits its own licence asks for.
      properties:
        url:
          type: string
          description: Where the browser fetches this pack.
        attribution:
          type: array
          description: >-
            Credits for **this** pack, to render wherever its textures are used and
            nowhere else. Empty when the operator configures none.


            Per pack rather than per server: two packs may be licensed differently, and a
            credit shown against the wrong one credits the wrong author. Configured beside
            the pack's URL in the query-service module, because the operator who picks a
            pack is the one who knows what its licence asks for -- splitting the two
            across two files on two hosts is how one of them goes stale.
          items:
            $ref: "#/components/schemas/ResourcePackAttribution"
    ResourcePackAttribution:
      type: object
      required: [text, url]
      description: One credit line for the resource pack.
      properties:
        text:
          type: string
          description: The credit, rendered as text and never as markup.
        url:
          type: string
          nullable: true
          description: >-
            Where the credit links, or null for plain text. Always an absolute http(s)
            URL -- the module rejects anything else at startup, and a client should
            re-check rather than trust it, since the value is operator-supplied and
            ends up in a page.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A stable, machine-readable error code (e.g. `WORLD_NOT_FOUND`).
        message:
          type: string
          description: A human-readable message. Never the raw text of an internal exception.
      required: [ error, message ]
    RegionResponse:
      type: object
      description: The region payload, mirroring what `/realty info` renders.
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        state:
          type: string
          nullable: true
        freehold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Freehold"
        leasehold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Leasehold"
        auction:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Auction"
        dimensions:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Dimensions"
        tags:
          type: array
          items:
            type: string
      required: [ worldGuardRegionId, world, tags ]
    RegionResponse_Freehold:
      type: object
      properties:
        titleHolder:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerRef"
        authority:
          $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
          nullable: true
          description: Null means the region is not currently for sale.
        lastSoldPrice:
          type: number
          nullable: true
        acceptingOffers:
          type: boolean
          description: Whether the title holder is currently taking offers on this plot.
      required: [ authority, acceptingOffers ]
    RegionResponse_Leasehold:
      type: object
      properties:
        landlord:
          $ref: "#/components/schemas/PlayerRef"
        tenant:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerRef"
        price:
          type: number
        durationSeconds:
          type: integer
          format: int64
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        extensionsUsed:
          type: integer
          nullable: true
        maxExtensions:
          type: integer
          nullable: true
          description: Null means unlimited extensions.
        terminationEffectiveDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null unless a party has given notice. The lease still runs until this
            date, so a consumer should read it as "ending", not "ended".
        terminatedByRole:
          type: string
          nullable: true
          description: Which party gave notice. Null alongside a null terminationEffectiveDate.
        acceptingTenants:
          type: boolean
          description: Whether the landlord is currently taking a new tenant.
      required: [ landlord, price, durationSeconds, acceptingTenants ]
    RegionResponse_Auction:
      type: object
      properties:
        endDate:
          type: string
          format: date-time
          nullable: true
        highestBid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionResponse_Bid"
        auctioneer:
          $ref: "#/components/schemas/PlayerRef"
        startDate:
          type: string
          format: date-time
        minBid:
          type: number
        minStep:
          type: number
          description: The smallest amount by which a new bid must beat the standing one.
        biddingDurationSeconds:
          type: integer
          format: int64
          description: >-
            How long bidding stays open past the last bid. `endDate` is this added
            to the last bid's time, or to `startDate` when nobody has bid.
        paymentDurationSeconds:
          type: integer
          format: int64
          description: How long the winner then has to pay.
      required: [ auctioneer, startDate, minBid, minStep, biddingDurationSeconds, paymentDurationSeconds ]
    RegionResponse_Bid:
      type: object
      properties:
        bidder:
          $ref: "#/components/schemas/PlayerRef"
        amount:
          type: number
      required: [ bidder, amount ]
    Dimensions:
      type: object
      nullable: true
      description: >-
        A region's WorldGuard geometry. Null when the query-service module is
        disabled or unreachable.
      properties:
        shape:
          type: string
          enum: [ CUBOID, POLYGONAL ]
        minY:
          type: integer
        maxY:
          type: integer
        priority:
          type: integer
          description: >-
            WorldGuard's own priority, which is what settles two regions
            covering the same block: the higher one is the region whose rules
            apply there. A client drawing a map wants it for the same reason,
            since a plot inside a district has to be drawn over the district to
            be seen. Zero for a region nobody has given a priority, which is
            WorldGuard's default and also what an older query-service module
            reports by saying nothing.
        points:
          type: array
          items:
            $ref: "#/components/schemas/Dimensions_Point"
      required: [ shape, minY, maxY, priority, points ]
    Dimensions_Point:
      type: object
      properties:
        x:
          type: integer
        z:
          type: integer
      required: [ x, z ]
    PlayerRegionsResponse:
      type: object
      description: >-
        The response for GET /v1/players/regions. When category=owned or
        category=rented was requested, `regions` carries that category's entries
        and `owned`/`landlord`/`rented` are omitted (not serialised as null).
        When category=all (the default), `owned`, `landlord` and `rented` are
        populated instead and `regions` is omitted. See the endpoint description
        for the shared-offset paging behaviour of category=all.
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        owned:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RegionRef"
        landlord:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RegionRef"
        rented:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRegionsResponse_RentedRef"
        regions:
          type: array
          description: >-
            Present only for a single-category request (category=owned or
            category=rented); its entries are RegionRef or RentedRef shaped
            per that category.
          items: {}
      required: [ player, page, pageSize, totalCount, totalPages ]
    PlayerRegionsResponse_RegionRef:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
      required: [ worldGuardRegionId, world ]
    PlayerRegionsResponse_RentedRef:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        endDate:
          type: string
          format: date-time
          nullable: true
        secondsRemaining:
          type: integer
          format: int64
          nullable: true
      required: [ worldGuardRegionId, world ]
    SearchResponse:
      type: object
      description: >-
        A page of search results. `results` is empty rather than absent when
        nothing matched.
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResponse_Result"
      required: [ page, pageSize, totalCount, totalPages, results ]
    SearchResponse_Result:
      type: object
      description: >-
        One matching region, as the search projection reports it. Deliberately
        minimal -- a browse listing shows identity, type and price, and fetches
        `/v1/regions` for the row a user opens.
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        contractType:
          type: string
          enum: [ freehold, leasehold ]
        price:
          type: [ number, "null" ]
          description: >-
            The asking price, or null for a freehold that is not currently for
            sale. Null only appears under `type=freehold`.
        state:
          type: string
          enum: [ FOR_SALE, SOLD, FOR_LEASE, LEASED ]
          description: >-
            Never null here: a search result matched on a contract, so it always
            has a state. Contrast `/v1/regions`, which lists contractless regions
            too and reports null for them.
        durationSeconds:
          type: [ integer, "null" ]
          format: int64
          description: >-
            The lease term the price buys, in seconds. Null for a freehold, whose
            price is a one-off. Carried here because a rent without its term is a
            number without a unit, and a listing should not have to fetch every
            region to say what its price means.
      required: [ worldGuardRegionId, world, contractType, price, state, durationSeconds ]
    RegionListResponse:
      type: object
      description: >-
        A page of registered regions. Entries carry identity only; `/v1/region`
        returns a single region's contracts, auction and tags.
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionListResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, regions ]
    RegionListResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
        state:
          type: [ string, "null" ]
          description: >-
            The region's state, so a browse grid need not call `/v1/region` once
            per row to learn it. Null for a registered region carrying no
            contract at all -- which `/v1/regions` lists and `/v1/regions/search`
            does not.
      required: [ worldGuardRegionId, world, state ]
    RegionsAtResponse:
      type: object
      properties:
        test:
          type: string
          enum: [ point, column ]
          description: >-
            Which question was answered. `point` when the request carried a `y`,
            `column` when it did not.
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionsAtResponse_Entry"
      required: [ test, regions ]
    RegionsAtResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        world:
          $ref: "#/components/schemas/WorldRef"
      required: [ worldGuardRegionId, world ]
    RegionMembersResponse:
      type: object
      properties:
        owners:
          $ref: "#/components/schemas/RegionMembersResponse_Party"
        members:
          $ref: "#/components/schemas/RegionMembersResponse_Party"
      required: [ owners, members ]
    RegionMembersResponse_Party:
      type: object
      description: >-
        One WorldGuard domain, with its three kinds of entry kept apart because
        WorldGuard stores three kinds and flattening them loses information.
      properties:
        players:
          type: array
          description: UUID entries, with a name where the module could supply one.
          items:
            $ref: "#/components/schemas/PlayerRef"
        playerNames:
          type: array
          description: >-
            Legacy name entries, which carry no UUID and so cannot be a
            PlayerRef. WorldGuard lower-cases these on the way in and they are
            reported as it holds them.
          items:
            type: string
        groups:
          type: array
          description: Permission group names, which are not players.
          items:
            type: string
      required: [ players, playerNames, groups ]
    WorldGeometryResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        world:
          $ref: "#/components/schemas/WorldRef"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/WorldGeometryResponse_Entry"
      required: [ page, pageSize, totalCount, totalPages, world, regions ]
    WorldGeometryResponse_Entry:
      type: object
      properties:
        worldGuardRegionId:
          type: string
        dimensions:
          oneOf:
            - $ref: "#/components/schemas/Dimensions"
            - type: "null"
          description: >-
            Null when the query-service module is disabled or unreachable, or
            when Realty has the region registered but WorldGuard no longer holds
            it. The row is still reported in either case.
      required: [ worldGuardRegionId, dimensions ]
